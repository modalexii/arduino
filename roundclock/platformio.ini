; Waveshare ESP32-S3-Touch-AMOLED-1.43 (ESP32-S3R8, 16MB flash, 8MB octal PSRAM)
; Uses the pioarduino platform (Arduino core 3.x) - the official PlatformIO
; espressif32 platform is stuck on core 2.x, which newer Arduino_GFX needs.

[env:amoled143]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi   ; R8 = octal PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial over the native USB-C port
    -DLV_CONF_INCLUDE_SIMPLE        ; LVGL finds include/lv_conf.h
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

monitor_speed = 115200
monitor_echo = yes             ; show what you type in the serial monitor
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lvgl/lvgl@~9.2.2
